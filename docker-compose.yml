services:
  news:
    # 联网准备时替换正式版本；共享目录读取现场 .env。
    image: news-runtime:__BUILD_VERSION__
    platform: linux/amd64
    container_name: news-__BUILD_VERSION__
    user: ${NEWS_RUN_UID:-10001}:${NEWS_RUN_GID:-10001}
    # PDF 日志与临时工作文件使用共享目录，兼容只读根文件系统。
    working_dir: ${NEWS_DATA_DIR:?请先填写容器归档目录}
    network_mode: host
    restart: unless-stopped
    init: true
    # 业务程序由镜像提供，现场配置只读挂载，采集时间由电子档案任务控制。
    volumes:
      - type: bind
        source: ./.env
        target: /app/config/news.env
        read_only: true
      - type: bind
        source: ${NEWS_HOST_DATA_DIR:?请先填写宿主机归档目录}
        target: ${NEWS_DATA_DIR:?请先填写容器归档目录}
      - type: volume
        source: news_state
        target: /var/lib/news/state
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  # 使用项目级持久卷，镜像升级或容器重建时保留任务记录。
  news_state:
